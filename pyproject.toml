[project]
name = "notion-job-search-hub"
version = "0.1.0"
description = "Find, evaluate, and track your next role through Notion and the CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "feedparser>=6.0",
    "rich>=13.7",
    "lingua-language-detector>=2.1",
    "platformdirs>=4.0",
    "keyring>=25.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
resume = ["pypdf>=4.0"]
capture = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
jobhub = "job_search_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_search_hub"]

[tool.hatch.build.targets.wheel.force-include]
"job_search_hub/db/schema.sql" = "job_search_hub/db/schema.sql"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: bounded public-source verification; run only with RUN_LIVE_SOURCE_TESTS=1",
]

[tool.hatch.build.targets.sdist]
include = [
    "/job_search_hub", "/tests", "/docs", "/tools", "/README.md", "/LICENSE",
    "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.python-version",
    "/.env.example", "/.github",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/.DS_Store"]
